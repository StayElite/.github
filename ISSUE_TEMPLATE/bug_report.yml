name: 🐛 Bug Report
description: Report a bug to help us improve Stay Elite projects.
title: "[Bug]: "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        ## Thanks for taking the time to report a bug! ❤️

        Please provide as much information as possible so we can reproduce and fix the issue.

  - type: input
    id: repository
    attributes:
      label: Repository
      description: Which Stay Elite repository is affected?
      placeholder: e.g. awesome-project
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clearly describe the issue.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Go to ...
        2. Click ...
        3. Run ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Logs
      description: Add screenshots, logs, or error messages if available.
      render: shell

  - type: dropdown
    id: operating_system
    attributes:
      label: Operating System
      options:
        - Windows
        - macOS
        - Linux
        - Android
        - iOS
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Project Version
      placeholder: e.g. v1.2.0

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Anything else you'd like to add?

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues before opening this report.
          required: true

        - label: I can reproduce this issue consistently.
          required: true

        - label: I have provided all relevant information.
          required: true