name: ✨ Feature Request
description: Suggest a new feature or improvement for a Stay Elite project.
title: "[Feature]: "
labels:
  - enhancement

body:
  - type: markdown
    attributes:
      value: |
        ## Thanks for your suggestion! 🚀

        We appreciate ideas from our community. Please provide as much detail as possible to help us understand your proposal.

  - type: input
    id: repository
    attributes:
      label: Repository
      description: Which Stay Elite repository is this feature for?
      placeholder: e.g. awesome-project
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem are you trying to solve?
      placeholder: Describe the issue or limitation you're experiencing.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see.
      placeholder: Explain your proposed feature or improvement.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or workarounds?

  - type: textarea
    id: benefits
    attributes:
      label: Expected Benefits
      description: How would this feature improve the project or user experience?

  - type: dropdown
    id: priority
    attributes:
      label: Feature Priority
      description: How important is this feature to you?
      options:
        - Nice to have
        - Important
        - Critical
    validations:
      required: true

  - type: dropdown
    id: breaking_change
    attributes:
      label: Could this introduce breaking changes?
      options:
        - "No"
        - "Yes"
        - Not sure
    validations:
      required: true

  - type: textarea
    id: mockups
    attributes:
      label: Mockups, Examples, or References
      description: Add screenshots, diagrams, links, or examples if applicable.

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Anything else you'd like us to know?

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues before submitting this request.
          required: true

        - label: This feature is not already available.
          required: true

        - label: I have provided enough information for the maintainers to evaluate this request.
          required: true