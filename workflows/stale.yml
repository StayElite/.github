name: Close Stale Issues and PRs

on:
  schedule:
    - cron: "0 0 * * *" # Runs every day at midnight

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-issue-stale: 30
          days-before-issue-close: 7
          stale-issue-message: "This issue has been automatically marked as stale because it has not had recent activity. It will be closed if no further activity occurs. Thank you for your contributions!"
          close-issue-message: "This issue has been closed due to inactivity. Feel free to re-open or open a new issue if you still need assistance."
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-pr-message: "This pull request has been automatically marked as stale because it has not had recent activity. It will be closed if no further activity occurs."
          close-pr-message: "This pull request has been closed due to inactivity."
          exempt-issue-labels: "pinned,security"
          exempt-pr-labels: "pinned,security"
