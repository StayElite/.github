version: 2

updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    assignees:
      - "NTDevLops"

  # npm / pnpm / yarn
  - package-ecosystem: "npm"
    directory: "/"
